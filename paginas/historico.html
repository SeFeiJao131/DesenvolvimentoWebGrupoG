<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Histórico de downloads — JoinRender">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/4.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/fonts.css">
  <title>Meus Downloads — JoinRender</title>

  <style>
    /* ── Página de histórico ─────────────────────────── */
    .hist-pagina {
      min-height: 100vh;
      padding: var(--space-xl) var(--container-pad) var(--space-2xl);
      max-width: 900px;
      margin: 0 auto;
    }

    .hist-topo {
      display: flex;
      align-items: baseline;
      gap: var(--space-sm);
      margin-bottom: var(--space-lg);
      border-bottom: 1px solid var(--cor-borda);
      padding-bottom: var(--space-md);
    }

    .hist-titulo {
      font-family: var(--font-serif-sc);
      font-size: clamp(22px, 4vw, 36px);
      color: var(--cor-creme);
      margin: 0;
    }

    .hist-contagem {
      font-family: var(--font-sans);
      font-size: 13px;
      color: var(--cor-texto-suave);
    }

    /* ── Estado de carregamento / vazio / erro ──────── */
    .hist-estado {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-xl) 0;
      color: var(--cor-texto-suave);
      font-family: var(--font-sans);
      font-size: 15px;
      text-align: center;
    }

    .hist-estado i {
      font-size: 36px;
      color: var(--cor-borda);
    }

    .hist-estado a {
      color: var(--cor-dourado);
      text-decoration: none;
    }

    .hist-estado a:hover {
      text-decoration: underline;
    }

    /* ── Lista de itens ─────────────────────────────── */
    .hist-lista {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hist-item {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      background: var(--cor-fundo-card);
      border: 1px solid var(--cor-borda-escura);
      border-radius: var(--radius-md);
      padding: 14px;
      text-decoration: none;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .hist-item:hover {
      border-color: var(--cor-borda);
      transform: translateX(3px);
    }

    .hist-item-img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      background: var(--cor-fundo-escuro);
      flex-shrink: 0;
    }

    /* Placeholder quando não há imagem */
    .hist-item-img-placeholder {
      width: 72px;
      height: 72px;
      border-radius: var(--radius-sm);
      background: var(--cor-fundo-escuro);
      border: 1px solid var(--cor-borda-escura);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: var(--cor-borda);
      font-size: 22px;
    }

    .hist-item-info {
      flex: 1;
      min-width: 0;
    }

    .hist-item-nome {
      font-family: var(--font-sans);
      font-size: 15px;
      font-weight: 500;
      color: var(--cor-creme);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .hist-item-data {
      font-family: var(--font-sans);
      font-size: 12px;
      color: var(--cor-texto-suave);
    }

    .hist-item-seta {
      color: var(--cor-borda);
      font-size: 16px;
      flex-shrink: 0;
      transition: color 0.2s ease;
    }

    .hist-item:hover .hist-item-seta {
      color: var(--cor-dourado);
    }

    /* ── Botão limpar histórico ─────────────────────── */
    .hist-rodape {
      margin-top: var(--space-lg);
      display: flex;
      justify-content: flex-end;
    }

    .hist-btn-limpar {
      background: none;
      border: 1px solid var(--cor-borda);
      border-radius: var(--radius-pill);
      color: var(--cor-texto-suave);
      font-family: var(--font-sans);
      font-size: 12px;
      padding: 6px 16px;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .hist-btn-limpar:hover {
      border-color: var(--cor-erro);
      color: var(--cor-erro);
    }

    /* ── Responsivo ─────────────────────────────────── */
    @media (max-width: 480px) {
      .hist-item-img,
      .hist-item-img-placeholder {
        width: 56px;
        height: 56px;
      }

      .hist-item-nome {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <header id="site-header">
    <nav class="navheader">
      <div class="lado-esquerdo">
        <a class="Logo" href="../index.html" aria-label="JoinRender - Início">JR.</a>
        <ul class="headerlinks" aria-label="Navegação principal">
          <li><a class="textobranco" href="LayoutTexturas.html">Texturas</a></li>
          <li><a class="textobranco" href="LayoutModelos.html">Modelos</a></li>
          <li><a class="textobranco" href="LayoutHdri.html">HDRIs</a></li>
        </ul>
      </div>
      <form class="barra-pesquisa" onsubmit="return false;" role="search" aria-label="Buscar assets">
        <i class="fi fi-rr-search" aria-hidden="true"></i>
        <input type="search" placeholder="Pesquisar..." aria-label="Pesquisar">
      </form>
      <button class="btn-hamburger" id="btn-hamburger"
        aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-drawer">
        <i class="fi fi-rr-menu-burger" aria-hidden="true"></i>
      </button>
      <div class="acoes-header">
        <a class="signupbotao" href="login.html">Login</a>
        <a class="loginbotao" href="Criarconta.html">Sign Up</a>
        <a class="textobranco" href="sobre.html">Sobre</a>
      </div>
    </nav>
  </header>

  <!-- Overlay busca -->
  <div class="overlay-busca" id="overlay-busca" role="dialog" aria-label="Busca" aria-modal="true">
    <div class="painel-busca">
      <div class="topo-busca">
        <a class="Logo" href="../index.html" aria-label="JoinRender">JR.</a>
        <div class="busca-expandida">
          <i class="fi fi-rr-search" aria-hidden="true"></i>
          <input type="search" placeholder="Pesquisar texturas, modelos, HDRIs..." aria-label="Pesquisar">
        </div>
      </div>
      <div class="conteudo-busca" aria-live="polite"></div>
    </div>
  </div>

  <!-- Drawer mobile -->
  <div class="nav-overlay" id="nav-overlay" aria-hidden="true"></div>
  <nav class="nav-drawer" id="nav-drawer" aria-label="Menu de navegação">
    <div class="nav-drawer-topo">
      <span class="nav-drawer-logo">JR.</span>
      <button class="btn-fechar-drawer" id="btn-fechar-drawer" aria-label="Fechar menu">
        <i class="fi fi-rr-cross-small" aria-hidden="true"></i>
      </button>
    </div>
    <a class="nav-drawer-link" href="LayoutTexturas.html">Texturas</a>
    <a class="nav-drawer-link" href="LayoutModelos.html">Modelos</a>
    <a class="nav-drawer-link" href="LayoutHdri.html">HDRIs</a>
    <a class="nav-drawer-link" href="sobre.html">Sobre</a>
    <div class="nav-drawer-divisor"></div>
    <div class="nav-drawer-acoes">
      <a class="signupbotao" href="login.html">Login</a>
      <a class="loginbotao" href="Criarconta.html">Sign Up</a>
    </div>
  </nav>

  <!-- Conteúdo principal -->
  <main class="hist-pagina" id="hist-pagina">
    <div class="hist-topo">
      <h1 class="hist-titulo">Meus Downloads</h1>
      <span class="hist-contagem" id="hist-contagem"></span>
    </div>

    <!-- Estado dinâmico: carregando / sem login / vazio / lista -->
    <div id="hist-conteudo">
      <div class="hist-estado">
        <i class="fi fi-rr-spinner" aria-hidden="true"></i>
        <span>Carregando...</span>
      </div>
    </div>
  </main>

  <script type="module" src="../js/main/main-historico.js"></script>
</body>

</html>
