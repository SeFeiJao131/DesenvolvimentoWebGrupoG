<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entrar na sua conta JoinRender">
  <title>Entrar — JoinRender</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="fonts.css">
</head>

<body class="login-body">

  <div class="container-principal" role="main">

    <!-- Lado esquerdo — imagem decorativa -->
    <div class="lado-esquerdo-login" aria-hidden="true">
      <h1>Bem-vindo de volta</h1>
      <div class="area-imagem">
        <img src="Imagens/ImagemLogin.png" alt="Imagem decorativa de login" loading="lazy">
      </div>
    </div>

    <!-- Formulário de login -->
    <div class="lado-direito-login">
      <h2>Entrar</h2>

      <div class="campos-login">
        <label for="input-email" class="sr-only">E-mail ou usuário</label>
        <input class="login-input" type="text" id="input-email"
          placeholder="E-mail ou usuário" autocomplete="username">

        <label for="input-senha" class="sr-only">Senha</label>
        <input class="login-input" type="password" id="input-senha"
          placeholder="Senha" autocomplete="current-password">

        <button type="button" class="botao-olho" id="botao-olho"
          aria-label="Mostrar ou esconder senha">👁</button>

        <label class="lembrar-login">
          <input type="checkbox" aria-label="Manter conectado">
          Manter conectado
        </label>
      </div>

      <button class="botao-entrar" type="button" id="botao-entrar">Entrar</button>

      <a class="link-esqueceu" href="#">Esqueceu sua senha?</a>

      <div class="divisor-login" aria-hidden="true">
        <div class="linha-divisor-login"></div>
        <span class="texto-divisor-login">Ou entre com</span>
        <div class="linha-divisor-login"></div>
      </div>

      <div class="botoes-sociais">
        <button class="botao-social-login" id="google-login" type="button">Google</button>
        <button class="botao-social-login" id="github-login" type="button">GitHub</button>
        <button class="botao-social-login" id="twitter-login" type="button">X (Twitter)</button>
      </div>
    </div>

    <!-- Rodapé do card -->
    <div class="rodape-login">
      <p>Não possui conta? <a href="Criarconta.html">Criar conta</a></p>
    </div>

  </div>

  <style>.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0}</style>

  <script type="module" src="login.js"></script>
</body>
</html>
